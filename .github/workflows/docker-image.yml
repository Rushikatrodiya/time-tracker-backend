name: Docker Image CI/CD

on:
  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ${{ steps.login-ecr.outputs.registry }}/time-tracker-backend:${{ github.sha }}

    - name: Push the Docker image
      run: docker push ${{ steps.login-ecr.outputs.registry }}/time-tracker-backend:${{ github.sha }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/time-tracker-backend:${{ github.sha }}
            docker stop my-app || true
            docker rm my-app || true
            aws ssm get-parameters-by-path --path "/time-tracker/" --with-decryption --region ap-south-1 --query "Parameters[*].[Name,Value]" --output text | while read name value; do echo "$(basename $name)=$value"; done > /home/ubuntu/.env
            docker run -d --name my-app --env-file /home/ubuntu/.env -p 3000:3000 ${{ steps.login-ecr.outputs.registry }}/time-tracker-backend:${{ github.sha }}

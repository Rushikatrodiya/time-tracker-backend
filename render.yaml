services:
  - type: web
    name: time-tracker-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - key: ACCESS_TOKEN_SECRET
        value: 5c290d200ecf8bb4ea3f3864bb8265522d7ffb6c5e1884fb7a7ae8f8568ab551e6cefdb4f8bcfeaf2c3d3de8c36bed285e9df8c02fb35a8e3427ab23ad9ae02a
      - key: REFRESH_TOKEN_EXPIRY
        value: "604800"
      - key: PORT
        value: "3000"

  - type: pserv
    name: postgres
    env: postgres
    plan: free
    ipAllowList: []

  - type: pserv
    name: redis
    env: redis
    plan: free
    ipAllowList: []

databases:
  - name: postgres
    engine: postgres
    plan: free
    version: "16"
